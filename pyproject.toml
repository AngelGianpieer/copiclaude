[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "copiclaude"
version = "0.2.0"
description = "Switch between Claude Code and GitHub Copilot CLI in the same project, carrying context across when one runs out of quota."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "AngelGianpieer" }]
keywords = ["claude", "claude-code", "copilot", "cli", "terminal", "orchestrator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/AngelGianpieer/copiclaude"
Issues = "https://github.com/AngelGianpieer/copiclaude/issues"

[project.scripts]
copiclaude = "copiclaude.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
